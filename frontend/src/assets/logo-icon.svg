<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7967F5"/>
      <stop offset="100%" stop-color="#5A49E0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9DB5"/>
      <stop offset="100%" stop-color="#FF6B8A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7967F5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular document background -->
  <circle cx="24" cy="24" r="20" fill="url(#bgGrad)" filter="url(#glow)"/>
  <circle cx="24" cy="24" r="20" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>

  <!-- Document inner lines (pastel white) -->
  <rect x="16" y="14" width="16" height="2.5" rx="1" fill="#FFF9F5" opacity="0.9"/>
  <rect x="16" y="19" width="12" height="2.5" rx="1" fill="#FFF9F5" opacity="0.7"/>
  <rect x="16" y="24" width="14" height="2.5" rx="1" fill="#FFF9F5" opacity="0.6"/>
  <rect x="16" y="29" width="10" height="2.5" rx="1" fill="#FFF9F5" opacity="0.5"/>

  <!-- AI chat bubble symbol -->
  <path d="M20 31 Q20 34 22 36 L24 39 L26 36 Q28 34 28 31 Q28 29 26 28 L22 28 Q20 29 20 31 Z" fill="url(#accentGrad)" opacity="0.95"/>
  <path d="M20 31 Q20 34 22 36 L24 39 L26 36 Q28 34 28 31 Q28 29 26 28 L22 28 Q20 29 20 31 Z" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5"/>

  <!-- Small accent dots -->
  <circle cx="32" cy="16" r="2" fill="#FFD58A" opacity="0.9"/>
  <circle cx="14" cy="38" r="1.5" fill="#79D8C3" opacity="0.9"/>
</svg>