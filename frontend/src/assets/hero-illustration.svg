<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" fill="none">
  <defs>
    <!-- Laptop gradients -->
    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8E0FF"/>
      <stop offset="50%" stop-color="#D4C8FF"/>
      <stop offset="100%" stop-color="#B8A8FF"/>
    </linearGradient>
    <linearGradient id="laptopEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8BCFF"/>
      <stop offset="100%" stop-color="#A090FF"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBFF"/>
      <stop offset="100%" stop-color="#F3EEFF"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E8FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8DFFF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0ECFF"/>
    </linearGradient>
    <linearGradient id="robotAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7967F5"/>
      <stop offset="100%" stop-color="#5A49E0"/>
    </linearGradient>
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E04040"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A9EFF"/>
      <stop offset="100%" stop-color="#2E7BD6"/>
    </linearGradient>
    <linearGradient id="pptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB040"/>
      <stop offset="100%" stop-color="#E88D20"/>
    </linearGradient>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9DB5"/>
      <stop offset="100%" stop-color="#FF7A95"/>
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79D8C3"/>
      <stop offset="100%" stop-color="#50C8A8"/>
    </linearGradient>
    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD58A"/>
      <stop offset="100%" stop-color="#FFB850"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD58A"/>
      <stop offset="100%" stop-color="#FF9DB5"/>
    </linearGradient>

    <!-- 3D Shadows -->
    <filter id="shadowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7967F5" flood-opacity="0.15"/>
    </filter>
    <filter id="shadowMed" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#7967F5" flood-opacity="0.18"/>
    </filter>
    <filter id="shadowHard" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <!-- Subtle noise texture -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feBlend in="SourceGraphic" in2="noise" mode="overlay" opacity="0.03"/>
    </filter>
  </defs>

  <!-- Subtle background accents -->
  <ellipse cx="680" cy="80" rx="180" ry="120" fill="#F0E8FF" opacity="0.4"/>
  <ellipse cx="-60" cy="500" rx="150" ry="100" fill="#FFF0F4" opacity="0.4"/>
  <ellipse cx="700" cy="480" rx="140" ry="90" fill="#FFF4E6" opacity="0.3"/>

  <!-- LAPTOP BASE -->
  <g transform="translate(140, 180)" filter="url(#shadowMed)">
    <!-- Bottom chassis -->
    <path d="M0,60 Q0,72 12,72 L432,72 Q444,72 444,60 L444,8 Q444,0 432,0 L12,0 Q0,0 0,8 Z" fill="url(#laptopBody)" filter="url(#noise)"/>
    <!-- Front edge -->
    <path d="M0,60 L444,60" stroke="url(#laptopEdge)" stroke-width="2" opacity="0.5"/>
    <!-- Bottom thickness -->
    <path d="M0,72 Q0,78 12,78 L432,78 Q444,78 444,72" fill="#A898FF" opacity="0.6"/>

    <!-- Trackpad -->
    <rect x="172" y="20" width="100" height="8" rx="4" fill="#C8BCFF" opacity="0.8"/>

    <!-- Keyboard area -->
    <g fill="#FFFFFF" opacity="0.9" filter="url(#shadowHard)">
      <rect x="20" y="-18" width="404" height="24" rx="4"/>
      <rect x="20" y="-14" width="404" height="8" rx="2" fill="#F8F6FF"/>
    </g>

    <!-- Ports -->
    <rect x="20" y="72" width="10" height="5" rx="1" fill="#7A6AE0" opacity="0.5"/>
    <rect x="36" y="72" width="10" height="5" rx="1" fill="#7A6AE0" opacity="0.5"/>
    <rect x="414" y="72" width="10" height="5" rx="1" fill="#7A6AE0" opacity="0.5"/>
    <rect x="400" y="72" width="10" height="5" rx="1" fill="#7A6AE0" opacity="0.5"/>

    <!-- Hinge -->
    <ellipse cx="222" cy="0" rx="30" ry="4" fill="#8A7AFF" opacity="0.4"/>
  </g>

  <!-- LAPTOP SCREEN -->
  <g transform="translate(158, -180)" filter="url(#shadowSoft)">
    <!-- Screen back -->
    <path d="M0,0 Q0,-12 12,-12 L396,-12 Q408,-12 408,0 L408,276 Q408,288 396,288 L12,288 Q0,288 0,276 Z" fill="#7967F5" filter="url(#noise)"/>
    <!-- Screen bezel -->
    <path d="M0,0 Q0,-8 8,-8 L400,-8 Q408,-8 408,0 L408,268 Q408,276 400,276 L8,276 Q0,276 0,268 Z" fill="#6A5AE0"/>
    <!-- Screen inner -->
    <path d="M8,8 Q8,4 12,4 L396,4 Q400,4 400,8 L400,260 Q400,264 396,260 L12,260 Q8,260 8,256 Z" fill="url(#screenBg)" filter="url(#noise)"/>
    <!-- Screen glass reflection -->
    <ellipse cx="204" cy="50" rx="180" ry="60" fill="url(#screenGlow)"/>
    <!-- Camera -->
    <circle cx="204" cy="0" r="4" fill="#4A3AE0"/>
    <circle cx="204" cy="0" r="2" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- ROBOT ON SCREEN -->
  <g transform="translate(198, -60)" filter="url(#shadowSoft)">
    <!-- Robot head (rounded square) -->
    <path d="M40,0 Q40,-8 48,-8 L132,-8 Q140,-8 140,0 L140,100 Q140,108 132,108 L48,108 Q40,108 40,100 Z" fill="url(#robotBody)" filter="url(#noise)"/>
    <path d="M40,0 Q40,-8 48,-8 L132,-8 Q140,-8 140,0 L140,100 Q140,108 132,108 L48,108 Q40,108 40,100 Z" stroke="#D8D0FF" stroke-width="2"/>

    <!-- Face screen -->
    <rect x="56" y="20" width="68" height="52" rx="8" fill="#25233A" opacity="0.95"/>
    <rect x="58" y="22" width="64" height="48" rx="6" fill="#1A182B"/>

    <!-- Eyes -->
    <ellipse cx="80" cy="44" rx="8" ry="12" fill="#FFFFFF"/>
    <ellipse cx="80" cy="44" rx="4" ry="6" fill="#7967F5"/>
    <ellipse cx="80" cy="38" rx="1.5" ry="2" fill="#FFFFFF"/>
    <ellipse cx="116" cy="44" rx="8" ry="12" fill="#FFFFFF"/>
    <ellipse cx="116" cy="44" rx="4" ry="6" fill="#7967F5"/>
    <ellipse cx="116" cy="38" rx="1.5" ry="2" fill="#FFFFFF"/>

    <!-- Mouth (smile) -->
    <path d="M80 68 Q92 76 104 68" stroke="#FF9DB5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Blush -->
    <ellipse cx="64" cy="56" rx="6" ry="3" fill="#FF9DB5" opacity="0.4"/>
    <ellipse cx="132" cy="56" rx="6" ry="3" fill="#FF9DB5" opacity="0.4"/>

    <!-- Antenna -->
    <path d="M92 -20 Q92 -32 100 -36" stroke="url(#robotAccent)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="-40" r="6" fill="url(#robotAccent)"/>
    <circle cx="100" cy="-40" r="3" fill="#FFFFFF" opacity="0.4"/>

    <!-- Ears/side panels -->
    <ellipse cx="32" cy="48" rx="8" ry="14" fill="url(#robotBody)" stroke="#D8D0FF" stroke-width="2"/>
    <ellipse cx="168" cy="48" rx="8" ry="14" fill="url(#robotBody)" stroke="#D8D0FF" stroke-width="2"/>

    <!-- Body -->
    <path d="M50,110 Q50,122 60,130 L120,130 Q130,122 130,110 Z" fill="url(#robotBody)" filter="url(#noise)"/>
    <path d="M50,110 Q50,122 60,130 L120,130 Q130,122 130,110 Z" stroke="#D8D0FF" stroke-width="2"/>
    <!-- Heart/core -->
    <circle cx="90" cy="118" r="10" fill="#FF9DB5" opacity="0.9"/>
    <circle cx="90" cy="118" r="5" fill="#FFFFFF" opacity="0.3"/>

    <!-- Arms -->
    <path d="M36,70 Q20,80 16,95 Q12,102 20,108" stroke="url(#robotBody)" stroke-width="16" stroke-linecap="round" fill="none" filter="url(#noise)"/>
    <path d="M164,70 Q180,80 184,95 Q188,102 180,108" stroke="url(#robotBody)" stroke-width="16" stroke-linecap="round" fill="none" filter="url(#noise)"/>
    <!-- Hands -->
    <circle cx="20" cy="108" r="10" fill="url(#robotBody)" filter="url(#noise)"/>
    <circle cx="180" cy="108" r="10" fill="url(#robotBody)" filter="url(#noise)"/>

    <!-- Legs -->
    <rect x="68" y="140" width="20" height="24" rx="4" fill="url(#robotBody)" filter="url(#noise)"/>
    <rect x="92" y="140" width="20" height="24" rx="4" fill="url(#robotBody)" filter="url(#noise)"/>
    <!-- Feet -->
    <ellipse cx="78" cy="168" rx="14" ry="6" fill="url(#robotBody)" filter="url(#noise)"/>
    <ellipse cx="102" cy="168" rx="14" ry="6" fill="url(#robotBody)" filter="url(#noise)"/>
  </g>

  <!-- FLOATING DOCUMENTS -->
  <!-- PDF Document (RED) -->
  <g transform="translate(520, -40) rotate(-12)" filter="url(#shadowMed)">
    <path d="M0,0 L80,0 Q84,0 84,4 L84,100 Q84,104 80,104 L0,104 Q-4,104 -4,100 L-4,4 Q-4,0 0,0 Z" fill="url(#pdfGrad)" filter="url(#noise)"/>
    <path d="M0,0 L80,0 Q84,0 84,4 L84,100 Q84,104 80,104 L0,104 Q-4,104 -4,100 L-4,4 Q-4,0 0,0 Z" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
    <!-- Red label bar -->
    <rect x="8" y="8" width="64" height="14" rx="3" fill="#FFFFFF" opacity="0.95"/>
    <text x="40" y="19" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#E04040" text-anchor="middle">PDF</text>
    <!-- Lines -->
    <g fill="#FFFFFF" opacity="0.7">
      <rect x="12" y="30" width="40" height="2" rx="1"/>
      <rect x="12" y="38" width="56" height="2" rx="1"/>
      <rect x="12" y="46" width="48" height="2" rx="1"/>
      <rect x="12" y="54" width="52" height="2" rx="1"/>
      <rect x="12" y="62" width="44" height="2" rx="1"/>
      <rect x="12" y="70" width="56" height="2" rx="1"/>
      <rect x="12" y="78" width="36" height="2" rx="1"/>
    </g>
    <!-- Page corner fold -->
    <path d="M56,0 L80,0 L80,24 L56,24 Z" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- DOC Document (BLUE) -->
  <g transform="translate(580, 120) rotate(8)" filter="url(#shadowMed)">
    <path d="M0,0 L70,0 Q74,0 74,4 L74,90 Q74,94 70,94 L0,94 Q-4,94 -4,90 L-4,4 Q-4,0 0,0 Z" fill="url(#docGrad)" filter="url(#noise)"/>
    <path d="M0,0 L70,0 Q74,0 74,4 L74,90 Q74,94 70,94 L0,94 Q-4,94 -4,90 L-4,4 Q-4,0 0,0 Z" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
    <rect x="8" y="8" width="54" height="12" rx="3" fill="#FFFFFF" opacity="0.95"/>
    <text x="35" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#2E7BD6" text-anchor="middle">DOC</text>
    <g fill="#FFFFFF" opacity="0.7">
      <rect x="10" y="28" width="35" height="2" rx="1"/>
      <rect x="10" y="36" width="50" height="2" rx="1"/>
      <rect x="10" y="44" width="42" height="2" rx="1"/>
      <rect x="10" y="52" width="48" height="2" rx="1"/>
      <rect x="10" y="60" width="38" height="2" rx="1"/>
    </g>
    <path d="M49,0 L70,0 L70,21 L49,21 Z" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- PPT Document (ORANGE) -->
  <g transform="translate(40, 100) rotate(-6)" filter="url(#shadowMed)">
    <path d="M0,0 L75,0 Q79,0 79,4 L79,95 Q79,99 75,99 L0,99 Q-4,99 -4,95 L-4,4 Q-4,0 0,0 Z" fill="url(#pptGrad)" filter="url(#noise)"/>
    <path d="M0,0 L75,0 Q79,0 79,4 L79,95 Q79,99 75,99 L0,99 Q-4,99 -4,95 L-4,4 Q-4,0 0,0 Z" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
    <rect x="8" y="8" width="59" height="12" rx="3" fill="#FFFFFF" opacity="0.95"/>
    <text x="37.5" y="17" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#E88D20" text-anchor="middle">PPT</text>
    <g fill="#FFFFFF" opacity="0.7">
      <rect x="10" y="28" width="40" height="2" rx="1"/>
      <rect x="10" y="36" width="55" height="2" rx="1"/>
      <rect x="10" y="44" width="45" height="2" rx="1"/>
      <rect x="10" y="52" width="50" height="2" rx="1"/>
      <rect x="10" y="60" width="38" height="2" rx="1"/>
    </g>
    <path d="M52.5,0 L75,0 L75,22.5 L52.5,22.5 Z" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <!-- BOOKS STACK -->
  <g transform="translate(-30, 320)" filter="url(#shadowSoft)">
    <!-- Book 1 (Pink) -->
    <path d="M0,0 L70,0 Q74,0 74,4 L74,16 Q74,20 70,20 L0,20 Q-4,20 -4,16 L-4,4 Q-4,0 0,0 Z" fill="url(#book1)" filter="url(#noise)"/>
    <path d="M0,0 L70,0 Q74,0 74,4 L74,16 Q74,20 70,20 L0,20 Q-4,20 -4,16 L-4,4 Q-4,0 0,0 Z" stroke="#FF7A95" stroke-width="1.5" opacity="0.4"/>
    <rect x="6" y="4" width="58" height="12" rx="1" fill="#FF9DB5" opacity="0.3"/>
    <!-- Book 2 (Mint) -->
    <path d="M8,22 L78,22 Q82,22 82,26 L82,38 Q82,42 78,42 L8,42 Q4,42 4,38 L4,26 Q4,22 8,22 Z" fill="url(#book2)" filter="url(#noise)"/>
    <path d="M8,22 L78,22 Q82,22 82,26 L82,38 Q82,42 78,42 L8,42 Q4,42 4,38 L4,26 Q4,22 8,22 Z" stroke="#50C8A8" stroke-width="1.5" opacity="0.4"/>
    <rect x="14" y="26" width="58" height="12" rx="1" fill="#79D8C3" opacity="0.3"/>
    <!-- Book 3 (Peach) -->
    <path d="M16,44 L86,44 Q90,44 90,48 L90,60 Q90,64 86,64 L16,64 Q12,64 12,60 L12,48 Q12,44 16,44 Z" fill="url(#book3)" filter="url(#noise)"/>
    <path d="M16,44 L86,44 Q90,44 90,48 L90,60 Q90,64 86,64 L16,64 Q12,64 12,60 L12,48 Q12,44 16,44 Z" stroke="#FFB850" stroke-width="1.5" opacity="0.4"/>
    <rect x="22" y="48" width="58" height="12" rx="1" fill="#FFD58A" opacity="0.3"/>
  </g>

  <!-- MAGNIFYING GLASS -->
  <g transform="translate(540, 360) rotate(25)" filter="url(#shadowMed)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#7967F5" stroke-width="4"/>
    <circle cx="28" cy="28" r="18" fill="#F0E8FF" opacity="0.6"/>
    <path d="M28 28 L50 50" stroke="#7967F5" stroke-width="4" stroke-linecap="round"/>
    <path d="M28 28 L50 50" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <circle cx="28" cy="28" r="8" fill="#FF9DB5" opacity="0.3"/>
  </g>

  <!-- SPARKLES -->
  <g fill="url(#sparkleGrad)">
    <path d="M100 180 L104 188 L100 196 L96 188 Z" transform="rotate(0 100 188)"/>
    <path d="M580 200 L586 206 L580 212 L574 206 Z" transform="rotate(15 580 206)"/>
    <path d="M300 460 L305 465 L300 470 L295 465 Z" transform="rotate(-10 300 465)"/>
    <path d="M160 400 L164 406 L160 412 L156 406 Z" transform="rotate(20 160 406)"/>
    <path d="M620 340 L626 346 L620 352 L614 346 Z" transform="rotate(-25 620 346)"/>
    <path d="M200 280 L204 286 L200 292 L196 286 Z" transform="rotate(30 200 286)"/>
    <path d="M480 400 L485 404 L480 408 L475 404 Z" transform="rotate(-5 480 404)"/>
    <path d="M80 440 L83 443 L80 446 L77 443 Z" transform="rotate(45 80 443)"/>
  </g>

  <!-- Small plant -->
  <g transform="translate(40, 480)" filter="url(#shadowSoft)">
    <path d="M20 40 Q20 20 40 20 Q60 20 60 40" stroke="#50C8A8" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M20 40 Q10 25 15 15" stroke="#50C8A8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M60 40 Q70 25 65 15" stroke="#50C8A8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="40" cy="50" rx="12" ry="5" fill="#7967F5" opacity="0.2"/>
  </g>
</svg>